name: CI
on: [push]
jobs:
  zig-test:
    runs-on: self-hosted
    steps:
      - name: Check out repository code
        uses: actions/checkout@v2
        with:
          clean: false
      - name: Build and test
        run: |
          test "$(zig version)" = 0.17.1
          zig build test
          zig build
